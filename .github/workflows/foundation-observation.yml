name: reference-lab-foundation-observation

on:
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: Exact main revision shared by plan, apply, and observation
        required: true
        type: string
      plan_id:
        description: Exact immutable foundation plan identifier
        required: true
        type: string
      apply_id:
        description: Exact self-attested foundation apply identifier
        required: true
        type: string
      expected_receipt_digest:
        description: Reviewer-recorded SHA-256 digest from the apply workflow
        required: true
        type: string
      plan_kms_key_version:
        description: Exact foundation-plan-signing KMS key version
        required: true
        type: string
      expected_plan_public_key_digest:
        description: Independently derived plan-signing public-key digest
        required: true
        type: string
      receipt_kms_key_version:
        description: Exact foundation-apply-receipt-signing KMS key version
        required: true
        type: string
      expected_receipt_public_key_digest:
        description: Independently derived receipt-signing public-key digest
        required: true
        type: string
      observation_kms_key_version:
        description: Exact foundation-observation-signing KMS key version
        required: true
        type: string
      expected_observation_public_key_digest:
        description: Independently derived observation-signing public-key digest
        required: true
        type: string
      reason:
        description: Bounded operator reason for this read-only observation
        required: true
        type: string

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: reference-lab-foundation-observation
  cancel-in-progress: false

jobs:
  observe:
    name: independent post-apply provider observation
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: reference-lab-foundation-observation
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_target_project_id: ${{ vars.GCP_TARGET_PROJECT_ID }}
      TF_VAR_services_project_id: ${{ vars.GCP_SERVICES_PROJECT_ID }}
      TF_VAR_signed_evidence_bucket_name: ${{ vars.GCP_SIGNED_EVIDENCE_BUCKET }}
      TF_VAR_raw_evidence_bucket_name: ${{ vars.GCP_RAW_EVIDENCE_BUCKET }}
      TF_VAR_bastion_source_image: ${{ vars.GCP_BASTION_SOURCE_IMAGE }}
      TF_VAR_probe_source_image: ${{ vars.GCP_PROBE_SOURCE_IMAGE }}
      TF_VAR_probe_container_image: ${{ vars.ORCHESTRA_PROBE_CONTAINER_IMAGE }}
      TF_VAR_approved_egress_cidrs: ${{ vars.GCP_APPROVED_EGRESS_CIDRS_JSON }}
      TF_VAR_iap_operator_members: ${{ vars.GCP_IAP_OPERATOR_MEMBERS_JSON || '[]' }}
      TF_VAR_gke_release_channel: ${{ vars.GCP_GKE_RELEASE_CHANNEL || 'STABLE' }}
      TF_VAR_certification_mode: "false"
      TF_VAR_lock_signed_evidence_bucket: "false"

    steps:
      - name: Require exact reviewed observation inputs
        env:
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
          PLAN_ID: ${{ inputs.plan_id }}
          APPLY_ID: ${{ inputs.apply_id }}
          EXPECTED_RECEIPT_DIGEST: ${{ inputs.expected_receipt_digest }}
          PLAN_KEY_VERSION: ${{ inputs.plan_kms_key_version }}
          EXPECTED_PLAN_PUBLIC_KEY_DIGEST: ${{ inputs.expected_plan_public_key_digest }}
          RECEIPT_KEY_VERSION: ${{ inputs.receipt_kms_key_version }}
          EXPECTED_RECEIPT_PUBLIC_KEY_DIGEST: ${{ inputs.expected_receipt_public_key_digest }}
          OBSERVATION_KEY_VERSION: ${{ inputs.observation_kms_key_version }}
          EXPECTED_OBSERVATION_PUBLIC_KEY_DIGEST: ${{ inputs.expected_observation_public_key_digest }}
          OBSERVATION_REASON: ${{ inputs.reason }}
          REVIEW_GATE_CONFIGURED: ${{ vars.FOUNDATION_OBSERVATION_REVIEW_GATE_CONFIGURED }}
          WIF_PROVIDER: ${{ vars.GCP_FOUNDATION_OBSERVATION_WIF_PROVIDER }}
          OBSERVER_SERVICE_ACCOUNT: ${{ vars.GCP_FOUNDATION_OBSERVATION_SERVICE_ACCOUNT }}
          STATE_BUCKET: ${{ vars.GCP_TERRAFORM_STATE_BUCKET }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_RUN_ATTEMPT" == "1" ]]
          [[ "$EXPECTED_MAIN_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$EXPECTED_MAIN_SHA" == "$GITHUB_SHA" ]]
          [[ "$PLAN_ID" =~ ^orchestra-foundation-plan-[1-9][0-9]*\.1$ ]]
          [[ "$APPLY_ID" =~ ^orchestra-foundation-apply-[1-9][0-9]*\.1$ ]]
          [[ "$EXPECTED_RECEIPT_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          [[ "$PLAN_KEY_VERSION" =~ ^[1-9][0-9]*$ ]]
          [[ "$EXPECTED_PLAN_PUBLIC_KEY_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          [[ "$RECEIPT_KEY_VERSION" =~ ^[1-9][0-9]*$ ]]
          [[ "$EXPECTED_RECEIPT_PUBLIC_KEY_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          [[ "$OBSERVATION_KEY_VERSION" =~ ^[1-9][0-9]*$ ]]
          [[ "$EXPECTED_OBSERVATION_PUBLIC_KEY_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          [[ ${#OBSERVATION_REASON} -ge 12 && ${#OBSERVATION_REASON} -le 500 ]]
          [[ "$REVIEW_GATE_CONFIGURED" == "true" ]]
          [[ "$WIF_PROVIDER" =~ ^projects/[1-9][0-9]*/locations/global/workloadIdentityPools/orchestra-lab-github/providers/foundation-observation$ ]]
          [[ "$OBSERVER_SERVICE_ACCOUNT" == "orchestra-foundation-observer@$TF_VAR_services_project_id.iam.gserviceaccount.com" ]]
          for name in \
            STATE_BUCKET TF_VAR_target_project_id TF_VAR_services_project_id \
            TF_VAR_signed_evidence_bucket_name TF_VAR_raw_evidence_bucket_name \
            TF_VAR_bastion_source_image TF_VAR_probe_source_image \
            TF_VAR_probe_container_image TF_VAR_approved_egress_cidrs; do
            [[ -n "${!name:-}" ]] || { echo "required configuration missing: $name" >&2; exit 1; }
          done

      - name: Check out reviewed main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Validate source contracts
        run: |
          python3 scripts/validate_repository.py
          python3 scripts/validate_prerequisite_policy.py
          python3 scripts/validate_foundation_apply_execution.py
          python3 scripts/validate_foundation_observation.py

      - name: Verify current independent observation approval
        env:
          GITHUB_ENVIRONMENT_READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          [[ -n "$GITHUB_ENVIRONMENT_READ_TOKEN" ]]
          printf '%s' "$GITHUB_ENVIRONMENT_READ_TOKEN" > "$RUNNER_TEMP/github-token"
          verification="$(python3 scripts/github_environment_contract.py verify \
            --contract foundation-observation \
            --token-file "$RUNNER_TEMP/github-token" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --workflow-actor-id "$GITHUB_ACTOR_ID")"
          printf '%s\n' "$verification"
          [[ "$verification" =~ digest=(sha256:[a-f0-9]{64}) ]]
          printf 'ENVIRONMENT_APPROVAL_DIGEST=%s\n' "${BASH_REMATCH[1]}" >> "$GITHUB_ENV"

      - name: Authenticate as the read-only foundation observer
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_FOUNDATION_OBSERVATION_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_FOUNDATION_OBSERVATION_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Set up Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.14.6"
          terraform_wrapper: false

      - name: Verify receipt and observe live foundation
        env:
          STATE_BUCKET: ${{ vars.GCP_TERRAFORM_STATE_BUCKET }}
          SERVICES_PROJECT_ID: ${{ vars.GCP_SERVICES_PROJECT_ID }}
          PLAN_ID: ${{ inputs.plan_id }}
          APPLY_ID: ${{ inputs.apply_id }}
          EXPECTED_RECEIPT_DIGEST: ${{ inputs.expected_receipt_digest }}
          PLAN_KEY_VERSION: ${{ inputs.plan_kms_key_version }}
          EXPECTED_PLAN_PUBLIC_KEY_DIGEST: ${{ inputs.expected_plan_public_key_digest }}
          RECEIPT_KEY_VERSION: ${{ inputs.receipt_kms_key_version }}
          EXPECTED_RECEIPT_PUBLIC_KEY_DIGEST: ${{ inputs.expected_receipt_public_key_digest }}
          OBSERVATION_KEY_VERSION: ${{ inputs.observation_kms_key_version }}
          EXPECTED_OBSERVATION_PUBLIC_KEY_DIGEST: ${{ inputs.expected_observation_public_key_digest }}
          OBSERVATION_REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          plan_key="gcpkms://projects/$SERVICES_PROJECT_ID/locations/europe-west1/keyRings/orchestra-lab-foundation-execution/cryptoKeys/foundation-plan-signing/cryptoKeyVersions/$PLAN_KEY_VERSION"
          receipt_key="gcpkms://projects/$SERVICES_PROJECT_ID/locations/europe-west1/keyRings/orchestra-lab-foundation-execution/cryptoKeys/foundation-apply-receipt-signing/cryptoKeyVersions/$RECEIPT_KEY_VERSION"
          observation_key="gcpkms://projects/$SERVICES_PROJECT_ID/locations/europe-west1/keyRings/orchestra-lab-foundation-execution/cryptoKeys/foundation-observation-signing/cryptoKeyVersions/$OBSERVATION_KEY_VERSION"
          observation_id="orchestra-foundation-observation-$GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT"
          scripts/observe_foundation_apply.sh \
            --state-bucket "$STATE_BUCKET" \
            --source-revision "$GITHUB_SHA" \
            --plan-id "$PLAN_ID" \
            --apply-id "$APPLY_ID" \
            --expected-receipt-digest "$EXPECTED_RECEIPT_DIGEST" \
            --plan-signing-key "$plan_key" \
            --expected-plan-public-key-digest "$EXPECTED_PLAN_PUBLIC_KEY_DIGEST" \
            --receipt-signing-key "$receipt_key" \
            --expected-receipt-public-key-digest "$EXPECTED_RECEIPT_PUBLIC_KEY_DIGEST" \
            --observation-signing-key "$observation_key" \
            --expected-observation-public-key-digest "$EXPECTED_OBSERVATION_PUBLIC_KEY_DIGEST" \
            --observation-id "$observation_id" \
            --environment-approval-digest "$ENVIRONMENT_APPROVAL_DIGEST" \
            --actor-id "$GITHUB_ACTOR_ID" \
            --reason "$OBSERVATION_REASON"

      - name: Remove transient credentials
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/github-token"
          find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -name 'gha-creds-*.json' -delete
