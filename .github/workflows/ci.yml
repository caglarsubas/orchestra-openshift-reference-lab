name: reference-lab-foundation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: reference-lab-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: contracts, safety, GitOps, and Terraform
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      receiver-postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_DB: receiver_ci
          POSTGRES_USER: receiver_ci
          POSTGRES_PASSWORD: receiver_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U receiver_ci -d receiver_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Validate locked topology and repository safety
        run: python3 scripts/validate_repository.py

      - name: Validate exact SNO OpenShift public toolchain lock
        run: python3 scripts/openshift_toolchain_intake.py validate-lock

      - name: Validate inert SNO workload and capacity candidate
        run: python3 scripts/validate_sno_trial_workload_candidate.py

      - name: Validate source-only SNO dependency runtime contracts
        run: python3 scripts/validate_sno_trial_dependency_runtime_contracts.py

      - name: Validate immutable SNO dependency artifact set
        run: python3 scripts/validate_sno_trial_dependency_artifacts.py

      - name: Validate inactive SNO dependency manifest candidate
        run: python3 scripts/validate_sno_trial_dependency_manifests.py

      - name: Validate SNO model and TLS integrity policy
        run: python3 scripts/sno_trial_dependency_integrity.py validate-policy

      - name: Validate SNO dependency server dry-run contract
        run: python3 scripts/sno_trial_dependency_dry_run.py validate-contract

      - name: Prove SNO dependency inputs and materialization remain non-authorizing
        run: >-
          python3 -m unittest
          tests.test_sno_trial_dependency_inputs
          tests.test_materialize_sno_trial_dependency_manifests
          tests.test_sno_trial_dependency_integrity
          tests.test_sno_trial_dependency_dry_run
          -v

      - name: Validate complete SNO workload image artifact set
        run: python3 scripts/sno_trial_product_artifacts.py validate-lock

      - name: Validate independent SNO product replay admission policy
        run: python3 scripts/sno_trial_product_artifact_admission.py validate-policy

      - name: Validate value-free SNO operator input contract
        run: python3 scripts/sno_trial_operator_inputs.py validate-lock

      - name: Prove pending SNO state cannot authorize cloud mutation
        run: |
          python3 scripts/sno_trial_readiness.py assess \
            --snapshot tests/fixtures/sno-trial-cloud-pending.json \
            --assessment-id sno-readiness-ci-pending.1 \
            --output "${RUNNER_TEMP}/sno-trial-readiness.json"
          python3 scripts/sno_trial_readiness.py verify \
            --report "${RUNNER_TEMP}/sno-trial-readiness.json"

      - name: Prove default SNO network drift blocks install authority
        run: |
          python3 scripts/sno_trial_network_hygiene.py assess \
            --snapshot tests/fixtures/sno-trial-network-dirty.json \
            --assessment-id sno-network-ci-dirty.1 \
            --output "${RUNNER_TEMP}/sno-trial-network-hygiene.json"
          python3 scripts/sno_trial_network_hygiene.py verify \
            --report "${RUNNER_TEMP}/sno-trial-network-hygiene.json"

      - name: Prove missing SNO DNS delegation grants no install authority
        run: |
          python3 scripts/sno_trial_dns_delegation.py assess \
            --snapshot tests/fixtures/sno-trial-dns-delegation-missing.json \
            --assessment-id sno-dns-ci-missing.1 \
            --output "${RUNNER_TEMP}/sno-trial-dns-delegation.json"
          python3 scripts/sno_trial_dns_delegation.py verify \
            --report "${RUNNER_TEMP}/sno-trial-dns-delegation.json"

      - name: Prove observed SNO operator path grants no install authority
        run: |
          python3 scripts/sno_trial_operator_path.py assess \
            --snapshot tests/fixtures/sno-trial-operator-path-ready.json \
            --assessment-id sno-operator-ci-ready.1 \
            --output "${RUNNER_TEMP}/sno-trial-operator-path.json"
          python3 scripts/sno_trial_operator_path.py verify \
            --report "${RUNNER_TEMP}/sno-trial-operator-path.json"

      - name: Prove healthy SNO observation grants no certification claim
        run: |
          python3 scripts/sno_trial_cluster_observation.py assess \
            --snapshot tests/fixtures/sno-trial-cluster-healthy.json \
            --assessment-id sno-cluster-ci-healthy.1 \
            --output "${RUNNER_TEMP}/sno-trial-cluster.json"
          python3 scripts/sno_trial_cluster_observation.py verify \
            --report "${RUNNER_TEMP}/sno-trial-cluster.json"

      - name: Prove SNO cost exposure remains estimate-only
        run: |
          python3 scripts/sno_trial_resource_exposure.py validate-rate-card
          python3 scripts/sno_trial_resource_exposure.py assess \
            --snapshot tests/fixtures/sno-trial-resource-exposure-active.json \
            --assessment-id sno-exposure-ci-active.1 \
            --output "${RUNNER_TEMP}/sno-trial-resource-exposure.json"
          python3 scripts/sno_trial_resource_exposure.py verify \
            --report "${RUNNER_TEMP}/sno-trial-resource-exposure.json"

      - name: Prove SNO server dry-run grants no deployment authority
        run: |
          python3 scripts/sno_trial_cluster_observation.py assess \
            --snapshot tests/fixtures/sno-trial-cluster-healthy.json \
            --assessment-id sno-cluster-ci-product-dry-run.1 \
            --output "${RUNNER_TEMP}/sno-trial-cluster-for-product.json"
          python3 scripts/sno_trial_product_dry_run.py assess \
            --snapshot tests/fixtures/sno-trial-product-dry-run-observed.json \
            --cluster-report "${RUNNER_TEMP}/sno-trial-cluster-for-product.json" \
            --assessment-id sno-product-dry-run-ci-observed.1 \
            --output "${RUNNER_TEMP}/sno-trial-product-dry-run.json"
          python3 scripts/sno_trial_product_dry_run.py verify \
            --report "${RUNNER_TEMP}/sno-trial-product-dry-run.json"

      - name: Prove simulated operator inputs cannot claim live resolution
        run: python3 -m unittest tests.test_sno_trial_operator_inputs -v

      - name: Prove aggregate SNO render admission remains non-mutating
        run: python3 -m unittest tests.test_sno_trial_install_admission -v

      - name: Validate immutable cross-plane release set
        run: python3 scripts/validate_release_set.py

      - name: Validate platform-owned certification contract intake
        run: python3 scripts/validate_reference_lab_contract_intake.py

      - name: Validate immutable dependency BOM
        run: python3 scripts/validate_dependency_bom.py

      - name: Validate fail-closed dependency admission
        run: python3 scripts/validate_dependency_admission.py

      - name: Validate source verification and empty mirror intake
        run: python3 scripts/validate_dependency_supply_chain.py

      - name: Validate unsigned-source risk and exception intake
        run: python3 scripts/validate_dependency_risk_intake.py

      - name: Validate preflight execution authority and isolation
        run: python3 scripts/validate_dependency_risk_execution.py

      - name: Validate full collection authority and restricted raw custody
        run: python3 scripts/validate_dependency_risk_collection_execution.py

      - name: Validate independent raw-custody verification authority
        run: python3 scripts/validate_dependency_risk_custody_verification.py

      - name: Validate blocked dependency GitOps candidate
        run: python3 scripts/validate_dependency_gitops_candidate.py

      - name: Validate staged prerequisite observation policy
        run: python3 scripts/validate_prerequisite_policy.py

      - name: Validate review-bound foundation apply authority
        run: python3 scripts/validate_foundation_apply_execution.py

      - name: Validate independent foundation observation authority
        run: python3 scripts/validate_foundation_observation.py

      - name: Validate operator control-plane readiness policy
        run: python3 scripts/operator_control_plane_readiness.py validate-policy

      - name: Validate immutable lab service publication policy
        run: python3 scripts/lab_service_publication.py validate-policy

      - name: Validate read-only lab service publication replay
        run: python3 scripts/lab_service_publication_replay.py validate-policy

      - name: Run contract tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Install durable receiver
        run: python3 -m pip install './services/release-validation-receiver[dev]'

      - name: Lint and format-check durable receiver
        run: |
          ruff check services/release-validation-receiver/src services/release-validation-receiver/tests
          ruff format --check services/release-validation-receiver/src services/release-validation-receiver/tests

      - name: Test durable receiver with PostgreSQL
        env:
          RECEIVER_TEST_DATABASE_URL: postgresql://receiver_ci:receiver_ci_only@127.0.0.1:5432/receiver_ci
        run: >-
          python3 -m unittest discover
          -s services/release-validation-receiver/tests
          -t services/release-validation-receiver
          -p 'test_*.py' -v

      - name: Build pinned UBI receiver image
        run: >-
          docker build --platform linux/amd64
          -t orchestra-release-validation-receiver:ci
          -f services/release-validation-receiver/Containerfile
          services/release-validation-receiver

      - name: Verify arbitrary-UID read-only receiver image
        run: >-
          docker run --rm --platform linux/amd64
          --user 1001230000 --read-only
          --tmpfs /tmp:rw,noexec,nosuid,size=16m
          --entrypoint python
          orchestra-release-validation-receiver:ci
          -c 'import orchestra_receiver.app, orchestra_receiver.worker'

      - name: Install synthetic tenant kit
        run: python3 -m pip install './services/synthetic-tenant-kit[dev]'

      - name: Lint and format-check synthetic tenant kit
        run: |
          ruff check services/synthetic-tenant-kit/src services/synthetic-tenant-kit/tests
          ruff format --check services/synthetic-tenant-kit/src services/synthetic-tenant-kit/tests

      - name: Test synthetic tenant and official MCP surfaces
        run: >-
          python3 -m unittest discover
          -s services/synthetic-tenant-kit/tests
          -t services/synthetic-tenant-kit
          -p 'test_*.py' -v

      - name: Audit lab-owned image dependency locks
        run: |
          python3 -m pip install pip-audit==2.10.1
          python3 -m pip_audit -r services/release-validation-receiver/requirements-linux-amd64.lock --disable-pip
          python3 -m pip_audit -r services/synthetic-tenant-kit/requirements-linux-amd64.lock --disable-pip

      - name: Build pinned UBI synthetic tenant image
        run: >-
          docker build --platform linux/amd64
          -t orchestra-synthetic-tenant-kit:ci
          -f services/synthetic-tenant-kit/Containerfile
          services/synthetic-tenant-kit

      - name: Verify arbitrary-UID read-only synthetic tenant image
        run: >-
          docker run --rm --platform linux/amd64
          --user 1001230000 --read-only
          --tmpfs /tmp:rw,noexec,nosuid,size=16m
          --entrypoint python
          orchestra-synthetic-tenant-kit:ci
          -c 'import orchestra_synthetic.gateway, orchestra_synthetic.mcp_surface, orchestra_synthetic.server'

      - name: Set up kubectl for deterministic Kustomize rendering
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0

      - name: Validate GitOps security floor
        run: kubectl kustomize gitops/clusters/reference-lab | python3 scripts/validate_rendered_gitops.py

      - name: Validate blocked dependency-plane GitOps floor
        run: kubectl kustomize gitops/dependencies/reference-lab | python3 scripts/validate_dependency_gitops.py

      - name: Render inactive SNO dependency manifest candidate
        run: kubectl kustomize gitops/dependencies/candidates/sno-trial >/dev/null

      - name: Validate digest-bound product GitOps
        run: kubectl kustomize gitops/products/reference-lab | python3 scripts/validate_product_gitops.py

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.14.6"
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive infra/terraform

      - name: Validate bootstrap module
        working-directory: infra/terraform/bootstrap
        run: |
          terraform init -backend=false -input=false -lockfile=readonly
          terraform validate

      - name: Validate foundation module
        working-directory: infra/terraform/foundation
        run: |
          terraform init -backend=false -input=false -lockfile=readonly
          terraform validate

      - name: Validate cost-bounded trial module
        working-directory: infra/terraform/sno-trial
        run: |
          terraform init -backend=false -input=false -lockfile=readonly
          terraform validate
          terraform test

      - name: Prove fixture prerequisites cannot enter ready state
        run: |
          if python3 scripts/validate_repository.py \
            --prerequisites config/prerequisites.example.json \
            --require-ready; then
            echo "fixture prerequisites unexpectedly passed" >&2
            exit 1
          fi
