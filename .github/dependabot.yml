version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: terraform
    directory: /infra/terraform/bootstrap
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  - package-ecosystem: terraform
    directory: /infra/terraform/foundation
    schedule:
      interval: weekly

  - package-ecosystem: terraform
    directory: /infra/terraform/sno-trial
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
