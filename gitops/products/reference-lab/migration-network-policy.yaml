apiVersion: v1
kind: ServiceAccount
metadata:
  name: orchestra-runtime-migration
  namespace: orchestra-runtime
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
automountServiceAccountToken: false
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: orchestra-platform-migration-egress
  namespace: orchestra-platform
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: migrate
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-dns
          podSelector:
            matchLabels:
              dns.operator.openshift.io/daemonset-dns: default
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - ipBlock: { cidr: 10.60.0.0/20 }
        - ipBlock: { cidr: 10.64.0.0/14 }
        - ipBlock: { cidr: 10.68.0.0/20 }
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 8443
