apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: orchestra-platform-secrets
  namespace: orchestra-platform
  annotations: { argocd.argoproj.io/sync-wave: "-2" }
spec:
  refreshInterval: 15m
  secretStoreRef: { kind: ClusterSecretStore, name: orchestra-vault }
  target: { name: orchestra-platform-secrets, creationPolicy: Owner }
  dataFrom:
    - extract: { key: kv/reference-lab/platform/secrets }
---
